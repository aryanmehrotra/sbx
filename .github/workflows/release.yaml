# Cutting a release, on a tag and nothing else.
#
#   write docs/release-notes/vX.Y.Z.md, commit it, then:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Everything below is what a person would otherwise do by hand and eventually do
# inconsistently: build every target, checksum them, attach them to a release, and publish
# the activator image. The binaries are built by scripts/release.sh - the same script used
# locally - so a release is never the first time that path runs.
#
# The notes are the exception: they are written by hand, and this refuses to build without
# them. GitHub will happily generate a release body from commit subjects, which reads as a
# changelog for people who already know the codebase and tells anybody deciding whether to
# adopt this precisely nothing. Generated notes are still appended - underneath the ones a
# person wrote, where they belong. See CONTRIBUTING.md.
#
# One step is deliberately still manual, because it writes to a different repository and
# automating it would mean storing a token here that can push to one:
#
#   scripts/brew-formula.sh vX.Y.Z > ../homebrew-tap/Formula/sbx.rb
#
# Run it after this workflow finishes - it reads the checksums out of the release this
# workflow published, so there is nothing for it to read until then.
#
# The Go version is pinned to an exact patch here, and only here. Go embeds its own version
# in every binary it builds, so `1.26` - which resolves to whatever patch is newest that day -
# means re-running this workflow on the same tag produces different bytes and a different
# checksum. v0.1.0 was built with 1.26.5, and a laptop on 1.26.3 could not reproduce it; with
# 1.26.5 and a clean checkout it reproduces bit for bit, from a different host OS and arch.
#
# ci.yaml deliberately stays on the floating minor: it publishes nothing, and testing against
# the newest patch is the point there.
#
# Bump this deliberately, as its own commit, so the version that built a release is a thing
# somebody chose rather than the date the tag happened to be pushed.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release and upload binaries
  packages: write   # push the activator image

jobs:
  # The gate. A tag that does not pass the same checks as a pull request is not a release,
  # and finding that out after the binaries are published is finding out too late.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      # Before anything is built, because notes written after the binaries are published are
      # notes nobody reads. A generated list of commit subjects is a changelog, not release
      # notes: it tells somebody who already knows the codebase what moved, and tells somebody
      # deciding whether to adopt this nothing at all. So the file is required, and a release
      # without one fails here rather than shipping with a link to a diff.
      - name: the release notes exist
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$notes" ]; then
            echo "::error::no release notes at $notes"
            echo
            echo "Write them before tagging - what changed, why anybody would want it, how to"
            echo "adopt it, and what it costs. docs/release-notes/ has the last one to follow,"
            echo "and CONTRIBUTING.md has the checklist."
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o sbx .
      - name: selftest
        run: ./sbx selftest
      - name: several sandboxes at once
        run: sudo apt-get update && sudo apt-get install -y redis-tools && ./scripts/e2e.sh 3

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: build every target
        run: ./scripts/release.sh "${GITHUB_REF_NAME}"

      # The checksums are published beside the binaries because install.sh verifies them.
      # A download nobody can check is a download nobody should run.
      #
      # body_path is the hand-written notes; generate_release_notes still appends the commit
      # list and the contributors underneath them. Both, in that order: the part a person reads
      # to decide whether to upgrade, then the part they read to find out what touched the file
      # they care about.
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sbx_*
            dist/SHA256SUMS
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: true

  # Benchmarks, recorded per release rather than written into the document.
  #
  # BENCHMARKS.md's premise is that every number was measured on the machine described beside it
  # and that nothing is quoted from a single run. A GitHub runner is a shared, virtualised
  # machine whose neighbours are invisible, so its figures are not comparable to the laptop ones
  # - overwriting them here would replace measurements somebody took with numbers nobody can
  # attribute, while the page still claimed they were taken on a MacBook.
  #
  # So they are attached to the release instead: the same four benchmarks, ten runs each, with
  # the machine that produced them written at the top. That gives a per-tag record of what this
  # code does on a known-shape runner, which is the thing you can compare release to release -
  # which is what a benchmark in a pipeline is actually for.
  #
  # Only the pure-Go ones. Wake latency needs containers and is dominated by whatever else the
  # runner is doing; a number that noisy, published every tag, would teach people to ignore it.
  benchmarks:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: measure
        run: |
          {
            echo "# sbx ${GITHUB_REF_NAME} - benchmarks on a GitHub runner"
            echo
            echo "Not the figures in docs/BENCHMARKS.md, which were measured on a laptop and say"
            echo "so. A runner is shared and virtualised; these are here to be compared with the"
            echo "same file from the previous tag, not with a machine you own."
            echo
            echo '```'
            echo "date        $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "go          $(go version | cut -d' ' -f3)"
            echo "cpu         $(nproc) x $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
            echo "memory      $(awk '/MemTotal/ {printf "%.1f GB", $2/1048576}' /proc/meminfo)"
            echo "kernel      $(uname -sr)"
            echo '```'
            echo
            echo '```'
          } > bench.md

          go test -run '^$' -bench 'RoundTrip|Stream' -count 10 ./internal/daemon/ >> bench.md 2>&1

          echo '```' >> bench.md

      - name: attach it to the release
        uses: softprops/action-gh-release@v2
        with:
          files: bench.md

  # The activator only exists as an image, so a cluster user has nothing to install without
  # this. Multi-arch because clusters are not all amd64 any more.
  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile copies a binary rather than building one, so that the image and the
      # published binaries come from the same compilation.
      - name: build the linux binaries the image needs
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o deploy/sbx.amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o deploy/sbx.arm64 .

      - uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-activator:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-activator:latest
