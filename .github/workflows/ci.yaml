# What has to be true before a change lands.
#
# The unit tests, the race detector and the shell tests run on Linux AND macOS, because
# "one static binary, anywhere" is a claim this project makes out loud and testing it on
# one platform proves nothing. That is not theoretical: two bugs in this repo were macOS
# only - bash 3.2, which macOS still ships, treats an empty array as unbound under `set -u`
# - and both were found by hand on a laptop rather than here.
#
# The end-to-end tests need a Docker daemon and stay Linux-only. GitHub's macOS runners
# have no daemon, and skipping them there is honest; pretending otherwise is not.
#
# What this costs, because a pipeline nobody has costed is one that quietly gets expensive:
# a full run is ~29 minutes of wall clock and ~68 BILLED minutes, because GitHub bills macOS
# at 10x. Two macOS jobs were 64% of the bill for 15% of the wall time. So:
#
#   - `shell (macos)` runs on every push. It earns its 10x: both macOS-only bugs this repo
#     has had were bash 3.2 treating an empty array as unbound under `set -u`, and only this
#     job would have caught them.
#   - `test (macos)` runs daily and on demand, not per push. Go's unit tests are far less
#     platform-sensitive than the shell is, so a day's latency on that signal is the cheaper
#     side of the trade.
#   - `zeropod` measures a COMPETITOR. It is data for BENCHMARKS.md, not a gate on whether
#     this code is correct, so it is scheduled rather than blocking every push.
#   - Cross-compilation is one job that loops, not seven jobs that each start a runner.
#   - A documentation-only push skips the Docker suites, which cannot be affected by an .md
#     file. The linters still run.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * *' # daily: the macOS unit tests and the competitor benchmark
  workflow_dispatch:

permissions:
  contents: read

# A push that supersedes another cancels it. Without this, three pushes in a minute pay for
# three full runs and only the last one's answer is wanted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Did anything that can affect behaviour change? A README edit cannot break the wake path,
  # and this repo's changes are often documentation only.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole push is the unit being tested, not its last commit, so the base of the
          # comparison can be any distance back. Shallow enough to miss it and the diff fails.
          fetch-depth: 0
      - id: filter
        run: |
          # Anything other than a push - a PR, a schedule, a manual run - is treated as
          # "code changed", because there is no range to compare.
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Everything the push contained, not just its tip.
          #
          # This compared HEAD^..HEAD, which is only the same question when a push carries one
          # commit. A push of five commits ending in a docs commit reported "documentation
          # only" and skipped every Docker suite - so the four commits of Go in front of it
          # went to main having been linted and never tested, under a green tick. Caught on
          # exactly such a push; the comment here used to say the cheap check was safe with
          # one commit to compare against, and nothing checked that there was one.
          base="${{ github.event.before }}"

          # A branch's first push has no before, and a force-push can name a commit that is no
          # longer reachable. Both mean the range is unknown, which is not the same as empty.
          case "$base" in
            ''|0000000000000000000000000000000000000000)
              echo "code=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          changed=$(git diff --name-only "$base" HEAD 2>/dev/null || echo unknown)

          if [ "$changed" = "unknown" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # A markdown file cannot change what the binary does. Nothing in the build, the
          # tests or the scripts reads one - except lint-docs.sh, which runs either way.
          if echo "$changed" | grep -qvE '(\.md$|^LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "documentation only - the Docker suites are skipped:"
            echo "$changed" | sed 's/^/  /'
          fi

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false # one platform failing should not hide the other's result
      matrix:
        # macOS bills at 10x, so its unit-test run is daily rather than per push - see the
        # header. The macOS *shell* job stays on every push, because that is the one that has
        # actually caught bugs here.
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: vet
        run: go vet ./...

      - name: gofmt
        # Not cosmetic: a diff that reformats unrelated lines hides the change inside it.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: test with the race detector
        # The daemon is the only genuinely concurrent thing here, so -race is not optional.
        run: go test -race ./...

      - name: console module
        # Its own module, so nothing else in the repo ever compiles it.
        run: |
          cd console
          go build ./...
          go vet ./...
          go test ./...

      - name: the root module has no dependencies
        # A product claim, a README badge, and the reason the console is a separate module.
        # Asserted here as well as in a Go test, because this is the one that gates a merge.
        run: |
          if grep -q '^require' go.mod; then
            echo "the root go.mod gained a dependency:"; grep '^require' -A 20 go.mod; exit 1
          fi

  # Cross-compilation is a claim this project makes out loud, so it is checked rather than
  # assumed. It exists so that the first import of something platform-specific fails here
  # rather than in someone's install.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # One runner, seven compiles. As a matrix this was seven runners doing thirty seconds
      # of work each, most of which was starting a runner. The compiler cache is shared here,
      # so it is also faster in wall clock.
      # Builds every package rather than just the main one, and vets as well as builds.
      # Vet type-checks _test.go files and build does not, which is how a real gap survived
      # this step: the production code compiled for windows and the TEST suite did not, so
      # nobody on windows could run it, and a step that only built `.` saw nothing wrong.
      - name: cross-compile and vet every published target
        run: bash scripts/platforms.sh

  # The shell that runs on a developer's machine is not the shell in CI. macOS ships bash
  # 3.2 from 2007 and every script here has to work on it: both empty-array bugs in this
  # repo were exactly that, and both reached main.
  shell:
    name: shell (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Always Linux: this job carries lint-docs, lint-workflows and shellcheck, which are
        # the checks a documentation change most needs. macOS joins it only when code
        # changed - it bills at 10x and no .md file has ever broken bash 3.2.
        os: ${{ needs.changes.outputs.code == 'true' && fromJSON('["ubuntu-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: bash version, for the record
        run: bash --version | head -1

      - name: shellcheck
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install shellcheck; else
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          shellcheck -S warning scripts/*.sh scripts/lib/*.sh deploy/entrypoint.sh

      - name: workflows parse
        # A workflow with a syntax error is rejected by GitHub in under a second with no
        # logs, while the previous run's green tick stays on the branch. This catches it
        # in a job that does produce logs.
        run: bash scripts/lint-workflows.sh

      - name: documentation links resolve
        # `[vendor][neon]` with no definition renders as literal text and reads like a
        # citation. Four sat in the vendor table of the document whose whole claim is that
        # every figure is measured here or quoted with a link.
        run: bash scripts/lint-docs.sh

      - name: templates are pinned by digest
        # A floating tag means the first thing anybody runs can break without a commit
        # touching this repo. Refresh with scripts/pin-templates.sh.
        run: bash scripts/pin-templates.sh --check

      - name: measurement maths
        run: bash scripts/lib/measure_test.sh

      - name: harness gating (injected failures)
        # The teardown-after-kill case needs docker and skips itself where there is none,
        # which is most of the point of running this on macOS at all: the gating logic is
        # shell, and shell is what differs between these two machines.
        run: bash scripts/compare_test.sh

  # The claims that only a real daemon can settle: a sandbox is created, sleeps to zero,
  # wakes on a plain socket, and remembers what it was told.
  selftest:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go build -o sbx .
      - name: selftest
        run: ./sbx selftest

  # Several at once, which is the actual premise: independent state, independent sleep, and
  # no sandbox answering with another's data.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: sudo apt-get update && sudo apt-get install -y redis-tools
      - run: go build -o sbx .
      - name: three sandboxes, concurrently
        run: ./scripts/e2e.sh 3

  # Snapshot and fork touch volumes, images and a stopped container's data directory, and
  # every one of those is a place where "it worked on my machine" has already been wrong
  # once here: docker commit silently excludes volumes.
  snapshot:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go build -o sbx .
      - name: seed, snapshot, fork twice, and prove the forks are independent
        run: ./scripts/fork-e2e.sh
      - name: data safety when a volume copy is killed mid-write
        # Kills fork/rm and the copy container itself at the worst moment, and asserts the
        # read-only source never moves and no half-copied fork is served as whole. The tier
        # above fork-e2e: not "does the copy replace correctly" but "what if it is cut in half".
        run: ./scripts/interrupt-e2e.sh 3

  # The daemon dying is the one failure nobody schedules. This kills it and asserts a running
  # sandbox is untouched, that a restarted daemon re-adopts sandboxes from container labels,
  # and that data survives - claims that were only ever checked when a human remembered to
  # run the script, which is not a regression barrier.
  recovery:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: sudo apt-get update && sudo apt-get install -y redis-tools
      - run: go build -o sbx .
      - name: kill the daemon and prove nothing was lost
        run: ./scripts/recovery.sh

  # What a new connection costs on a sandbox that is already awake. This is the number that
  # was missing: the daemon re-ran the health command through `docker exec` on every accepted
  # connection, costing 68 ms each, and no benchmark in the repo could see it.
  connections:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: sudo apt-get update && sudo apt-get install -y redis-tools
      - run: go build -o sbx .
      - name: a new connection to an awake sandbox is not a docker exec
        run: ./scripts/connbench.sh 20

  # Every case the README tells someone to do. A failure here means the documentation is
  # lying, which is how this suite found `ready` reporting a sandbox as serving on an
  # address that accepted nothing.
  usecases:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go build -o sbx .
      - name: the documented use cases, end to end
        run: ./scripts/usecases-e2e.sh

  # "--isolation gvisor is declarable" was a claim with nothing behind it: the flag existed,
  # it failed closed when the runtime was absent, and no machine in this project had ever
  # run a sandbox under it. A runtime nobody has exercised is a runtime that does not work.
  #
  # This installs gVisor and proves three things: the sandbox runs under runsc rather than
  # runc, the whole sleep/wake cycle still works there, and the kernel it sees is gVisor's
  # rather than the host's - which is the actual claim isolation makes.
  isolation:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: install gVisor
        run: |
          set -eux
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          sudo apt-get update && sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'

      - name: sbx reports the runtime as available
        # doctor exists so nobody learns this from a failed create. If it still says the
        # runtime is missing after an install, doctor is wrong and that is worth failing on.
        #
        # Checked with grep rather than an inline script: an embedded multi-line python
        # block inside `run: |` ends the YAML scalar at its first column-0 line, which
        # rejected this whole workflow in 0s the first time it was pushed.
        run: |
          set -eux
          go build -o sbx .
          ./sbx doctor
          ./sbx doctor --json > doctor.json
          grep -A 1 '"name": "isolation gvisor"' doctor.json | grep -q '"have": true'

      - name: a sandbox actually runs under gVisor
        run: |
          set -eux
          ./sbx create iso-check --template postgres -isolation gvisor
          # The container's runtime, from docker rather than from our own claim.
          runtime=$(docker inspect -f '{{.HostConfig.Runtime}}' sbx-iso-check-postgres)
          test "$runtime" = "runsc"
          # And the kernel it sees is gVisor's, not this host's. This is the isolation.
          uname_in=$(docker exec sbx-iso-check-postgres uname -a)
          echo "$uname_in"
          echo "$uname_in" | grep -qi gvisor
          ./sbx rm iso-check

      - name: the whole cycle works under gVisor, not just create
        # Sleep and wake are the product; isolation that only survives a create is not a
        # tier anyone can use.
        run: ./sbx selftest -isolation gvisor

  # zeropod is the only rival that beats sbx: it CRIU-checkpoints and restores memory and
  # processes, where sbx restores a disk and starts the process cold. It went unmeasured for
  # a reason that was honest and self-serving - its README calls arm64-in-a-VM-on-macOS
  # flaky, which is the author's laptop. That is an argument for measuring it elsewhere.
  #
  # Not required to pass. It installs a containerd shim into a throwaway kind cluster and
  # depends on an upstream project's manifests, so a red tick here would mean "their release
  # moved", not "this repo is broken". It reports, and the report is read.
  zeropod:
    # Scheduled, not per push. This measures a rival's wake path for BENCHMARKS.md - it says
    # nothing about whether this commit is correct, and it stands up a kind cluster to do it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: measure zeropod
        run: ./scripts/zeropod-probe.sh 5
