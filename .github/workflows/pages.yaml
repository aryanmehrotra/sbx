# The landing page, published to GitHub Pages from main. It is one static HTML file plus the
# README's own pictures (scripts/site-build.sh copies them from docs/), so it rebuilds only when
# one of those changes.
#
# To turn it on, once: Settings → Pages → Source: GitHub Actions, then add a repository variable
# SBX_PAGES=true (Settings → Secrets and variables → Actions → Variables). Until then the job is
# skipped rather than failing: deploy-pages errors out on a repository without Pages, and a red
# run on every push to main would teach everyone to ignore main's status.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/bench-*.svg'
      - 'docs/how-it-works.svg'
      - 'docs/social-preview.png'
      - scripts/site-build.sh
      - .github/workflows/pages.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.SBX_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: bash scripts/site-build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
