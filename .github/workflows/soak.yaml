# Endurance, tied to what it protects, not a clock. A leak that only shows over time should not
# block a PR (it would make every push slow), and should not burn a runner nightly on a repo that
# did not change - so it runs when code lands on main and when a release is cut, plus on demand.
# Path-filtered: a docs-only push does not spend ten minutes proving the daemon still does not leak.
name: soak

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - go.mod
      - scripts/soak.sh
      - .github/workflows/soak.yaml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      seconds:
        description: how long to churn
        default: '600'
      sandboxes:
        description: how many sandboxes to churn across
        default: '4'

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go build -o sbx .
      - name: churn and watch fd + RSS for a leak
        # The daemon is what this measures, so start one and drive load through it in the same
        # shell. soak.sh samples fd and RSS while quiescent and fails if either climbs with the
        # connection count. On a clean runner there is nothing else pointed at the daemon, so the
        # number is the leak and nothing else.
        run: |
          ./sbx serve --idle 30m > sbx-serve.log 2>&1 &
          sleep 3
          ./scripts/soak.sh "${{ github.event.inputs.seconds || '600' }}" "${{ github.event.inputs.sandboxes || '4' }}"
      - name: the daemon's log, if it failed
        if: failure()
        run: cat sbx-serve.log
