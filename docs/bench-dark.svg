<svg xmlns="http://www.w3.org/2000/svg" width="900" height="264" viewBox="0 0 900 264" role="img" aria-label="Memory held by 20 idle Postgres databases: sbx, asleep 17.6 MB, docker compose, always on 629 MB; Time until a sleeping Postgres answers psql: sbx 348 ms, Lazytainer (wakes on traffic) 3,407 ms" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<text x="0" y="22" font-size="15" font-weight="600" fill="#e6edf3">Memory held by 20 idle Postgres databases</text>
<text x="210" y="60.0" font-size="13" text-anchor="end" fill="#e6edf3" font-weight="600">sbx, asleep</text>
<rect x="220" y="46.0" width="13.1" height="18" rx="3" fill="#2ea043"/>
<text x="241.1" y="60.0" font-size="13" fill="#e6edf3" font-weight="600">17.6 MB</text>
<text x="210" y="94.0" font-size="13" text-anchor="end" fill="#e6edf3">docker compose, always on</text>
<rect x="220" y="80.0" width="470.0" height="18" rx="3" fill="#656d76"/>
<text x="698.0" y="94.0" font-size="13" fill="#e6edf3">629 MB</text>
<text x="0" y="136" font-size="15" font-weight="600" fill="#e6edf3">Time until a sleeping Postgres answers psql</text>
<text x="210" y="174.0" font-size="13" text-anchor="end" fill="#e6edf3" font-weight="600">sbx</text>
<rect x="220" y="160.0" width="48.0" height="18" rx="3" fill="#2ea043"/>
<text x="276.0" y="174.0" font-size="13" fill="#e6edf3" font-weight="600">348 ms<tspan fill="#9198a1" font-weight="400">  ·  first try served: 20 of 20</tspan></text>
<text x="210" y="208.0" font-size="13" text-anchor="end" fill="#e6edf3">Lazytainer (wakes on traffic)</text>
<rect x="220" y="194.0" width="470.0" height="18" rx="3" fill="#656d76"/>
<text x="698.0" y="208.0" font-size="13" fill="#e6edf3">3,407 ms<tspan fill="#9198a1" font-weight="400">  ·  first try refused: 0 of 5</tspan></text>
<line x1="0" x2="900" y1="236" y2="236" stroke="#3d444d" stroke-width="1"/>
<text x="0" y="256" font-size="12" fill="#9198a1">Lower is better. sbx v0.14.0 on a 4 vCPU Linux VM with Docker 29. Memory: lower of 2 runs; time: median. Method in docs/BENCHMARKS.md.</text>
</svg>
