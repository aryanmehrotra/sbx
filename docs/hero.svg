<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="sbx - a real Postgres, Redis or browser for every branch, task or agent, that costs 0 B of RAM idle and wakes on a TCP connection">
  <defs>
    <radialGradient id="glow" cx="82%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#1f6feb" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#9fb0c0"/>
    </linearGradient>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
      .sans{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    </style>
  </defs>

  <rect width="1200" height="360" rx="18" fill="#0d1117"/>
  <rect width="1200" height="360" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="17.5" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- wordmark + tagline -->
  <text x="64" y="150" class="mono" font-size="118" font-weight="700" fill="url(#wm)" letter-spacing="-3">sbx</text>
  <rect x="70" y="176" width="150" height="4" rx="2" fill="#3fb950"/>

  <text x="66" y="228" class="sans" font-size="27" font-weight="600" fill="#c9d1d9">A real Postgres, Redis or browser for every</text>
  <text x="66" y="264" class="sans" font-size="27" font-weight="600" fill="#c9d1d9">branch or agent — <tspan fill="#3fb950">0 B idle</tspan>, <tspan fill="#58a6ff">woken by a connection</tspan>.</text>

  <!-- chips -->
  <g class="mono" font-size="16">
    <rect x="66" y="296" width="122" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <circle cx="86" cy="313" r="4" fill="#3fb950"/>
    <text x="98" y="318" fill="#adbac7">0 B idle</text>

    <rect x="198" y="296" width="168" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <circle cx="218" cy="313" r="4" fill="#58a6ff"/>
    <text x="230" y="318" fill="#adbac7">wakes ~191 ms</text>

    <rect x="376" y="296" width="196" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <circle cx="396" cy="313" r="4" fill="#d2a8ff"/>
    <text x="408" y="318" fill="#adbac7">zero dependencies</text>
  </g>

  <!-- sandbox cards motif (right) -->
  <g class="mono" font-size="17">
    <!-- serving -->
    <rect x="812" y="64" width="324" height="52" rx="10" fill="#132018" stroke="#238636"/>
    <circle cx="838" cy="90" r="5" fill="#3fb950"/>
    <text x="856" y="95" fill="#e6edf3">main</text>
    <text x="1116" y="95" text-anchor="end" fill="#3fb950">● serving</text>

    <!-- asleep -->
    <rect x="812" y="126" width="324" height="52" rx="10" fill="#0f141a" stroke="#21262d"/>
    <circle cx="838" cy="152" r="5" fill="#484f58"/>
    <text x="856" y="157" fill="#8b949e">feature-x</text>
    <text x="1116" y="157" text-anchor="end" fill="#6e7681">○ 0 B asleep</text>

    <rect x="812" y="188" width="324" height="52" rx="10" fill="#0f141a" stroke="#21262d"/>
    <circle cx="838" cy="214" r="5" fill="#484f58"/>
    <text x="856" y="219" fill="#8b949e">agent-4711</text>
    <text x="1116" y="219" text-anchor="end" fill="#6e7681">○ 0 B asleep</text>

    <rect x="812" y="250" width="324" height="52" rx="10" fill="#0f141a" stroke="#21262d"/>
    <circle cx="838" cy="276" r="5" fill="#484f58"/>
    <text x="856" y="281" fill="#8b949e">review-99</text>
    <text x="1116" y="281" text-anchor="end" fill="#6e7681">○ 0 B asleep</text>

    <!-- connect arrow into feature-x -->
    <text x="700" y="157" class="mono" font-size="15" fill="#58a6ff">psql ▸</text>
    <path d="M754 152 H806" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  </g>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#58a6ff"/>
    </marker>
  </defs>
</svg>
