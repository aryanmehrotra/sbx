<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="sbx: a real database for every branch and AI agent. Sleeps at 0 B, wakes the moment anything connects. No SDK, self-hosted. psql connects, sbx holds the connection, postgres wakes, the query is served.">
