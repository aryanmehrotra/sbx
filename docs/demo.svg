<svg xmlns="http://www.w3.org/2000/svg" width="900" height="938" viewBox="0 0 900 938" role="img" aria-label="A terminal running sbx: a sandbox is created from a template, its addresses are exported, an agent reads them as JSON, a service is added mid-task, a snapshot is forked, the sandbox sleeps to zero and a plain connection wakes it.">
<style>text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;font-size:13.5px;white-space:pre}.b{font-weight:600}@media (prefers-reduced-motion:no-preference){.cur{animation:blink 1s steps(1) infinite}@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}}</style>
<rect width="900" height="938" rx="10" fill="#0d1117"/>
<rect width="900" height="46" rx="10" fill="#161b22"/>
<rect y="36" width="900" height="10" fill="#161b22"/>
<circle cx="26" cy="23" r="6" fill="#ff5f57"/>
<circle cx="46" cy="23" r="6" fill="#febc2e"/>
<circle cx="66" cy="23" r="6" fill="#28c840"/>
<text x="450" y="28" fill="#8b949e" text-anchor="middle" class="b">sbx</text>
<text x="22" y="74.0" xml:space="preserve"><tspan fill="#58a6ff" class="b">$ </tspan><tspan fill="#c9d1d9" class="b">sbx create feature-x --template web-stack</tspan></text>
<text x="22" y="94.5" xml:space="preserve" fill="#c9d1d9">sandbox &quot;feature-x&quot;  provider docker  isolation container</text>
<text x="22" y="115.0" xml:space="preserve" fill="#3fb950">  postgres     ✓ 127.0.0.1:20040</text>
<text x="22" y="135.5" xml:space="preserve" fill="#3fb950">  redis        ✓ 127.0.0.1:20041</text>
<text x="22" y="156.0" xml:space="preserve" fill="#8b949e">ready. Nothing needs starting again - connecting wakes it, idleness sleeps it.</text>
<text x="22" y="197.0" xml:space="preserve"><tspan fill="#58a6ff" class="b">$ </tspan><tspan fill="#c9d1d9" class="b">eval &quot;$(sbx env feature-x)&quot;    # it remembers what it was made from</tspan></text>
<text x="22" y="217.5" xml:space="preserve" fill="#c9d1d9">export SBX_SANDBOX=&#x27;feature-x&#x27;</text>
<text x="22" y="238.0" xml:space="preserve" fill="#c9d1d9">export SBX_PROVIDER=&#x27;docker&#x27;</text>
<text x="22" y="258.5" xml:space="preserve" fill="#c9d1d9">export DATABASE_HOST=&#x27;127.0.0.1&#x27;</text>
<text x="22" y="279.0" xml:space="preserve" fill="#c9d1d9">export DATABASE_PORT=&#x27;20040&#x27;</text>
<text x="22" y="299.5" xml:space="preserve" fill="#c9d1d9">export REDIS_HOST=&#x27;127.0.0.1&#x27;</text>
<text x="22" y="320.0" xml:space="preserve" fill="#c9d1d9">export REDIS_PORT=&#x27;20041&#x27;</text>
<text x="22" y="361.0" xml:space="preserve"><tspan fill="#58a6ff" class="b">$ </tspan><tspan fill="#c9d1d9" class="b">sbx env feature-x --shell json          # no SDK; an agent parses this</tspan></text>
<text x="22" y="381.5" xml:space="preserve" fill="#c9d1d9">{</text>
<text x="22" y="402.0" xml:space="preserve" fill="#c9d1d9">  &quot;DATABASE_HOST&quot;: &quot;127.0.0.1&quot;,</text>
<text x="22" y="422.5" xml:space="preserve" fill="#c9d1d9">  &quot;DATABASE_PORT&quot;: &quot;20040&quot;,</text>
<text x="22" y="443.0" xml:space="preserve" fill="#c9d1d9">  &quot;REDIS_HOST&quot;: &quot;127.0.0.1&quot;,</text>
<text x="22" y="463.5" xml:space="preserve" fill="#c9d1d9">  &quot;REDIS_PORT&quot;: &quot;20041&quot;,</text>
<text x="22" y="484.0" xml:space="preserve" fill="#c9d1d9">  &quot;SBX_PROVIDER&quot;: &quot;docker&quot;,</text>
<text x="22" y="504.5" xml:space="preserve" fill="#c9d1d9">  ...</text>
<text x="22" y="545.5" xml:space="preserve"><tspan fill="#58a6ff" class="b">$ </tspan><tspan fill="#c9d1d9" class="b">sbx add feature-x cache --image redis:7-alpine --port 6379 --health &#x27;redis-cli ping&#x27;</tspan></text>
<text x="22" y="566.0" xml:space="preserve" fill="#3fb950">  cache        ✓ 127.0.0.1:20042</text>
<text x="22" y="607.0" xml:space="preserve"><tspan fill="#58a6ff" class="b">$ </tspan><tspan fill="#c9d1d9" class="b">sbx snapshot main golden &amp;&amp; sbx fork golden agent-1</tspan></text>
<text x="22" y="627.5" xml:space="preserve" fill="#c9d1d9">  postgres     → sbx-snap-golden-postgres:latest  + volume sbx-snapvol-golden-postgres</text>
<text x="22" y="648.0" xml:space="preserve" fill="#c9d1d9">  postgres     restored from sbx-snapvol-golden-postgres</text>
<text x="22" y="668.5" xml:space="preserve" fill="#c9d1d9">  forked from snapshot &quot;golden&quot; - filesystem state only, processes start cold.</text>
<text x="22" y="689.0" xml:space="preserve" fill="#3fb950">  agent-1 carries the seeded row: seeded</text>
<text x="22" y="730.0" xml:space="preserve" fill="#8b949e"># nobody touches it for a few seconds</text>
<text x="22" y="750.5" xml:space="preserve"><tspan fill="#39c5cf" class="b">INFO </tspan><tspan fill="#8b949e">feature-x/redis  slept - idle for 8s</tspan><tspan fill="#c9d1d9">  </tspan></text>
<text x="22" y="771.0" xml:space="preserve" fill="#3fb950">  asleep - 0 B of memory, the volume untouched</text>
<text x="22" y="812.0" xml:space="preserve"><tspan fill="#58a6ff" class="b">$ </tspan><tspan fill="#c9d1d9" class="b">redis-cli ping        # an ordinary client; no SDK, no wrapper</tspan></text>
<text x="22" y="832.5" xml:space="preserve" fill="#c9d1d9">PONG</text>
<text x="22" y="853.0" xml:space="preserve"><tspan fill="#39c5cf" class="b">INFO </tspan><tspan fill="#8b949e">feature-x/redis  woke in 137ms</tspan><tspan fill="#c9d1d9">  </tspan></text>
<text x="22" y="873.5" xml:space="preserve" fill="#3fb950">  served in 167ms - the client waited, it was never refused</text>
<rect x="22" y="882.0" width="8" height="15" fill="#c9d1d9" class="cur"/>
</svg>
