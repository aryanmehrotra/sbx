0%,34.37%{opacity:0}34.37%,100%{opacity:1}}.l17{opacity:0;animation:k17 16.15s steps(1) infinite}@keyframes k17{0%,36.22%{opacity:0}36.22%,100%{opacity:1}}.l18{opacity:0;animation:k18 16.15s steps(1) infinite}@keyframes k18{0%,38.08%{opacity:0}38.08%,100%{opacity:1}}.l19{opacity:0;animation:k19 16.15s steps(1) infinite}@keyframes k19{0%,39.94%{opacity:0}39.94%,100%{opacity:1}}.l20{opacity:0;animation:k20 16.15s steps(1) infinite}@keyframes k20{0%,41.8%{opacity:0}41.8%,100%{opacity:1}}.l21{opacity:0;animation:k21 16.15s steps(1) infinite}@keyframes k21{0%,43.65%{opacity:0}43.65%,100%{opacity:1}}.l22{opacity:0;animation:k22 16.15s steps(1) infinite}@keyframes k22{0%,45.51%{opacity:0}45.51%,100%{opacity:1}}.l23{opacity:0;animation:k23 16.15s steps(1) infinite}@keyframes k23{0%,47.37%{opacity:0}47.37%,100%{opacity:1}}.l24{opacity:0;animation:k24 16.15s steps(1) infinite}@keyframes k24{0%,50.77%{opacity:0}50.77%,100%{opacity:1}}.l25{opacity:0;animation:k25 16.15s steps(1) infinite}@keyframes k25{0%,52.63%{opacity:0}52.63%,100%{opacity:1}}.l26{opacity:0;animation:k26 16.15s steps(1) infinite}@keyframes k26{0%,54.49%{opacity:0}54.49%,100%{opacity:1}}.l27{opacity:0;animation:k27 16.15s steps(1) infinite}@keyframes k27{0%,57.89%{opacity:0}57.89%,100%{opacity:1}}.l28{opacity:0;animation:k28 16.15s steps(1) infinite}@keyframes k28{0%,59.75%{opacity:0}59.75%,100%{opacity:1}}.l29{opacity:0;animation:k29 16.15s steps(1) infinite}@keyframes k29{0%,61.61%{opacity:0}61.61%,100%{opacity:1}}.l30{opacity:0;animation:k30 16.15s steps(1) infinite}@keyframes k30{0%,63.47%{opacity:0}63.47%,100%{opacity:1}}.l31{opacity:0;animation:k31 16.15s steps(1) infinite}@keyframes k31{0%,65.33%{opacity:0}65.33%,100%{opacity:1}}.l32{opacity:0;animation:k32 16.15s steps(1) infinite}@keyframes k32{0%,67.18%{opacity:0}67.18%,100%{opacity:1}}.l33{opacity:0;animation:k33 16.15s steps(1) infinite}@keyframes k33{0%,70.59%{opacity:0}70.59%,100%{opacity:1}}.l34{opacity:0;animation:k34 16.15s steps(1) infinite}@keyframes k34{0%,72.45%{opacity:0}72.45%,100%{opacity:1}}.l35{opacity:0;animation:k35 16.15s steps(1) infinite}@keyframes k35{0%,74.3%{opacity:0}74.3%,100%{opacity:1}}.l36{opacity:0;animation:k36 16.15s steps(1) infinite}@keyframes k36{0%,76.16%{opacity:0}76.16%,100%{opacity:1}}.l37{opacity:0;animation:k37 16.15s steps(1) infinite}@keyframes k37{0%,79.57%{opacity:0}79.57%,100%{opacity:1}}.l38{opacity:0;animation:k38 16.15s steps(1) infinite}@keyframes k38{0%,81.42%{opacity:0}81.42%,100%{opacity:1}}.l39{opacity:0;animation:k39 16.15s steps(1) infinite}@keyframes k39{0%,83.28%{opacity:0}83.28%,100%{opacity:1}}.cur{animation:blink 1s steps(1) infinite}@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}}</style>
<rect width="900" height="938" rx="10" fill="#0d1117"/>
<rect width="900" height="46" rx="10" fill="#161b22"/>
<rect y="36" width="900" height="10" fill="#161b22"/>
<circle cx="26" cy="23" r="6" fill="#ff5f57"/>
<circle cx="46" cy="23" r="6" fill="#febc2e"/>
<circle cx="66" cy="23" r="6" fill="#28c840"/>
<text x="450" y="28" fill="#8b949e" text-anchor="middle" class="b">sbx</text>
<text x="22" y="74.0" xml:space="preserve" class="l0"><tspan fill="#58a6ff" class="b">$ </tspan><tspan fill="#c9d1d9" class="b">sbx create feature-x --template web-stack</tspan></text>
<text x="22" y="94.5" xml:space="preserve" fill="#c9d1d9" class="l1">sandbox &quot;feature-x&quot;  provider docker  isolation container</text>
<text x="22" y="115.0" xml:space="preserve" fill="#3fb950" class="l2">  postgres     ✓ 127.0.0.1:20040</text>
<text x="22" y="135.5" xml:space="preserve" fill="#3fb950" class="l3">  redis        ✓ 127.0.0.1:20041</text>
<text x="22" y="156.0" xml:space="preserve" fill="#8b949e" class="l4">ready. Nothing needs starting again - connecting wakes it, idleness sleeps it.</text>
<text x="22" y="197.0" xml:space="preserve" class="l6"><tspan fill="#58a6ff" class="b">$ </tspan><tspan fill="#c9d1d9" class="b">eval &quot;$(sbx env feature-x)&quot;    # it remembers what it was made from</tspan></text>
<text x="22" y="217.5" xml:space="preserve" fill="#c9d1d9" class="l7">export SBX_SANDBOX=&#x27;feature-x&#x27;</text>
<text x="22" y="238.0" xml:space="preserve" fill="#c9d1d9" class="l8">export SBX_PROVIDER=&#x27;docker&#x27;</text>
<text x="22" y="258.5" xml:space="preserve" fill="#c9d1d9" class="l9">export DATABASE_HOST=&#x27;127.0.0.1&#x27;</text>
<text x="22" y="279.0" xml:space="preserve" fill="#c9d1d9" class="l10">export DATABASE_PORT=&#x27;20040&#x27;</text>
<text x="22" y="299.5" xml:space="preserve" fill="#c9d1d9" class="l11">export REDIS_HOST=&#x27;127.0.0.1&#x27;</text>
<text x="22" y="320.0" xml:space="preserve" fill="#c9d1d9" class="l12">export REDIS_PORT=&#x27;20041&#x27;</text>
<text x="22" y="361.0" xml:space="preserve" class="l14"><tspan fill="#58a6ff" class="b">$ </tspan><tspan fill="#c9d1d9" class="b">sbx env feature-x --shell json          # no SDK; an agent parses this</tspan></text>
<text x="22" y="381.5" xml:space="preserve" fill="#c9d1d9" class="l15">{</text>
<text x="22" y="402.0" xml:space="preserve" fill="#c9d1d9" class="l16">  &quot;DATABASE_HOST&quot;: &quot;127.0.0.1&quot;,</text>
<text x="22" y="422.5" xml:space="preserve" fill="#c9d1d9" class="l17">  &quot;DATABASE_PORT&quot;: &quot;20040&quot;,</text>
<text x="22" y="443.0" xml:space="preserve" fill="#c9d1d9" class="l18">  &quot;REDIS_HOST&quot;: &quot;127.0.0.1&quot;,</text>
<text x="22" y="463.5" xml:space="preserve" fill="#c9d1d9" class="l19">  &quot;REDIS_PORT&quot;: &quot;20041&quot;,</text>
<text x="22" y="484.0" xml:space="preserve" fill="#c9d1d9" class="l20">  &quot;SBX_PROVIDER&quot;: &quot;docker&quot;,</text>
<text x="22" y="504.5" xml:space="preserve" fill="#c9d1d9" class="l21">  ...</text>
<text x="22" y="545.5" xml:space="preserve" class="l23"><tspan fill="#58a6ff" class="b">$ </tspan><tspan fill="#c9d1d9" class="b">sbx add feature-x cache --image redis:7-alpine --port 6379 --health &#x27;redis-cli ping&#x27;</tspan></text>
<text x="22" y="566.0" xml:space="preserve" fill="#3fb950" class="l24">  cache        ✓ 127.0.0.1:20042</text>
<text x="22" y="607.0" xml:space="preserve" class="l26"><tspan fill="#58a6ff" class="b">$ </tspan><tspan fill="#c9d1d9" class="b">sbx snapshot main golden &amp;&amp; sbx fork golden agent-1</tspan></text>
<text x="22" y="627.5" xml:space="preserve" fill="#c9d1d9" class="l27">  postgres     → sbx-snap-golden-postgres:latest  + volume sbx-snapvol-golden-postgres</text>
<text x="22" y="648.0" xml:space="preserve" fill="#c9d1d9" class="l28">  postgres     restored from sbx-snapvol-golden-postgres</text>
<text x="22" y="668.5" xml:space="preserve" fill="#c9d1d9" class="l29">  forked from snapshot &quot;golden&quot; - filesystem state only, processes start cold.</text>
<text x="22" y="689.0" xml:space="preserve" fill="#3fb950" class="l30">  agent-1 carries the seeded row: seeded</text>
<text x="22" y="730.0" xml:space="preserve" fill="#8b949e" class="l32"># nobody touches it for a few seconds</text>
<text x="22" y="750.5" xml:space="preserve" class="l33"><tspan fill="#39c5cf" class="b">INFO </tspan><tspan fill="#8b949e">feature-x/redis  slept - idle for 7s</tspan><tspan fill="#c9d1d9">  </tspan></text>
<text x="22" y="771.0" xml:space="preserve" fill="#3fb950" class="l34">  asleep - 0 B of memory, the volume untouched</text>
<text x="22" y="812.0" xml:space="preserve" class="l36"><tspan fill="#58a6ff" class="b">$ </tspan><tspan fill="#c9d1d9" class="b">redis-cli ping        # any TCP connection; no SDK, no wrapper</tspan></text>
<text x="22" y="832.5" xml:space="preserve" fill="#c9d1d9" class="l37">+PONG</text>
<text x="22" y="853.0" xml:space="preserve" class="l38"><tspan fill="#39c5cf" class="b">INFO </tspan><tspan fill="#8b949e">feature-x/redis  woke in 557ms</tspan><tspan fill="#c9d1d9">  </tspan></text>
<text x="22" y="873.5" xml:space="preserve" fill="#3fb950" class="l39">  served in 635ms - the client waited, it was never refused</text>
<rect x="22" y="882.0" width="8" height="15" fill="#c9d1d9" class="cur"/>
</svg>
